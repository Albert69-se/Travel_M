<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Travel M — low-fidelity trip planner prototype</title>
    <!-- Map library, loaded from a CDN and pinned to a version. It executes before
         the application module below, and the application checks for it rather
         than assuming it, so the page still works with no network. -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#view">Skip to main content</a>

    <div id="app">
      <header class="app-header">
        <div class="wrap header-inner">
          <p class="brand">Travel M</p>
          <p class="brand-note">MENU · DEMO</p>
          <nav id="nav" class="nav" aria-label="Main"></nav>
          <div id="session-bar" class="session-bar"></div>
        </div>
      </header>

      <main id="view" class="wrap" tabindex="-1"></main>

      <footer class="app-footer">
        <div class="wrap">
          <p class="fineprint">LOW-FIDELITY PROTOTYPE · SAMPLE DATA — NOT LIVE VERIFIED</p>
          <p id="status-line" class="status-line" role="status" aria-live="polite"></p>
          <p>
            <button type="button" data-action="reset:data">Reset sample data</button>
          </p>
          <p class="fineprint">
            Stored locally in this browser only. No accounts, no server, no shared data.
          </p>
        </div>
      </footer>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
